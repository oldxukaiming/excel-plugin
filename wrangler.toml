name = "excel-translator-addin"
main = "cloudflare/worker.js"
compatibility_date = "2024-11-01"

[build]
command = "npm run build:static"

[assets]
directory = "./dist/static"
binding = "ASSETS"
run_worker_first = ["/api/*", "/"]

# Optional: bind your Cloudflare custom domain directly in Dashboard or uncomment below:
# routes = [
#   { pattern = "excel.yourdomain.com", custom_domain = true }
# ]
